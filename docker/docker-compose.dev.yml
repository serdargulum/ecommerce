# Geliştirme ortamı.
#   cd docker && docker compose -f docker-compose.dev.yml up
# API .NET SDK imajında kaynak kodu volume'den çalıştırır (dotnet watch → hot reload),
# web ise `next dev` ile çalışır. Üretim yapılandırması docker-compose.yml dosyasındadır.
name: ecommerce-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?docker/.env içinde POSTGRES_PASSWORD tanımlayın}
    volumes:
      # Üretimden ayrı volume: `down -v` üretim verisini etkilemez.
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    restart: unless-stopped
    # dotnet watch'ın etkileşimli konsolu için.
    tty: true
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # macOS/Windows bind mount'larında inotify olayları güvenilir değil: polling ile izle.
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      # Hot reload desteklemeyen (rude) değişikliklerde süreci otomatik yeniden başlat.
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-ecommerce};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?docker/.env içinde en az 32 karakterlik JWT_KEY tanımlayın}
      Jwt__Issuer: ${JWT_ISSUER:-Ecommerce.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Ecommerce.Web}
      Cors__AllowedOrigins__0: ${DEV_WEB_ORIGIN:-http://localhost:3001}
    volumes:
      # Kaynak kod anında container içinde; bin/obj ve NuGet önbelleği volume'de kalır.
      - ../backend:/src
      - api-bin:/src/bin
      - api-obj:/src/obj
      - nuget-packages:/root/.nuget/packages
      - uploads-dev:/src/wwwroot/uploads
      # uploads volume'ü kaynak ağacını gölgelediği için seed görselleri ayrıca bağlanır.
      - ../backend/wwwroot/uploads/seed:/seed-images:ro
    ports:
      - "${DEV_API_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    command: >
      sh -c "mkdir -p /src/wwwroot/uploads/seed &&
             cp -n /seed-images/* /src/wwwroot/uploads/seed/ 2>/dev/null || true;
             exec dotnet watch --non-interactive run --no-launch-profile --urls http://+:8080"

  web:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    environment:
      # Sunucu bileşenleri API'ye iç ağdan erişir; tarayıcı NEXT_PUBLIC_API_URL kullanır.
      API_URL: http://api:8080
      NEXT_PUBLIC_API_URL: ${DEV_NEXT_PUBLIC_API_URL:-http://localhost:8081}
      NEXT_TELEMETRY_DISABLED: "1"
      # Bind mount üzerinde dosya değişikliklerinin algılanması için.
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/app
      - web-node-modules:/app/node_modules
    ports:
      - "${DEV_WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    command: >
      sh -c "[ -x node_modules/.bin/next ] || npm ci;
             exec npm run dev -- --port 3000 --hostname 0.0.0.0"

volumes:
  pgdata-dev:
  uploads-dev:
  api-bin:
  api-obj:
  nuget-packages:
  web-node-modules:
